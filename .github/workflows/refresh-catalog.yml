name: Validate 90/90 catalog source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate catalog source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
      MDBLIST_LIST_URL: ${{ vars.MDBLIST_LIST_URL }}
      NINETY_NINETY_MIN_MOVIES: "25"
      DRY_RUN: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate MDBList catalog
        run: node scripts/ingest-mdblist.mjs
